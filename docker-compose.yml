# archivist + von (default System 1 model) with a persistent weights volume.
#
# Quick start (CPU):
#   mkdir -p in out            # drop markdown into ./in, results land in ./out
#   docker compose up --build  # von downloads weights into the volume on first run
#
# GPU (NVIDIA): add the override file, which requests all GPUs and sets the
# device to CUDA:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
#
# The weights live in the named volume `model-weights`; a second `up` reuses
# them and skips the ~multi-GB download.

services:
  # One-shot init: ensures the weights volume is writable by von (uid 1001)
  # before it tries to download the model from Hugging Face. Exits immediately
  # after chown; Docker marks it as completed (exit 0) so von can start.
  init-weights:
    image: alpine:3
    user: root
    volumes:
      - model-weights:/weights
    command: ["sh", "-c", "chown -R 1001:1001 /weights && chmod 755 /weights"]
    restart: "no"

  von:
    image: ghcr.io/wfzyx/von:cpu
    depends_on:
      init-weights:
        condition: service_completed_successfully
    env_file:
      - compose/von.env
    volumes:
      # HF_HOME points here (see von.env); a populated volume short-circuits the
      # download on restart.
      - model-weights:/weights
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s
    expose:
      - "8000"
    # Uncomment to reach the model server from the host (e.g. for local dev):
    # ports:
    #   - "8000:8000"

  archivist:
    build:
      context: .
    depends_on:
      von:
        condition: service_healthy
    environment:
      ARCHIVIST_MODEL: von
      ARCHIVIST_MODEL_URL: http://von:8000
      ARCHIVIST_NO_PREVIEW: "true"
    volumes:
      - ./in:/data/in
      - ./out:/data/out
      - ./examples:/data/examples:ro
      # Optional: mount your config and taxonomy/tags files.
      # - ./config.yaml:/data/config.yaml:ro
    # `run` reads env + any mounted /data/config.yaml.
    command: ["run"]

volumes:
  model-weights: {}
