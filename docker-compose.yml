# archivist — model server + archivist in one compose file.
#
# All model variants expose themselves as "model-server" on the internal
# network, so archivist always connects to http://model-server:8000
# regardless of which model is selected.
#
# ┌─────────────────────────────────────────────────────────┐
# │  Model       Profile(s)   Command                       │
# ├─────────────────────────────────────────────────────────┤
# │  von  CPU    (default)    docker compose up --build     │
# │  von  GPU    gpu          COMPOSE_PROFILES=gpu …        │
# │  laya CPU    laya         COMPOSE_PROFILES=laya …       │
# │  laya GPU    laya,gpu     COMPOSE_PROFILES=laya,gpu …   │
# └─────────────────────────────────────────────────────────┘
#
# Weights live in the named volume `model-weights` and are reused across
# runs; the download only happens once on a clean volume.

services:

  # ── init ────────────────────────────────────────────────────────────────────
  # One-shot: ensures the weights volume is writable before any model starts.
  init-weights:
    image: alpine:3
    user: root
    volumes:
      - model-weights:/weights
    command: ["sh", "-c", "chown -R 1001:1001 /weights && chmod 755 /weights"]
    restart: "no"

  # ── von CPU (default) ───────────────────────────────────────────────────────
  von:
    image: ghcr.io/wfzyx/von:cpu
    profiles: ["", "von"]
    env_file: [compose/von.env]
    volumes:
      - model-weights:/weights
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s
    depends_on:
      init-weights:
        condition: service_completed_successfully
    expose: ["8000"]
    networks:
      default:
        aliases: [model-server]

  # ── von GPU ─────────────────────────────────────────────────────────────────
  von-gpu:
    image: ghcr.io/wfzyx/von:cuda
    profiles: ["gpu"]
    env_file: [compose/von.env]
    environment:
      VON_DEVICE: cuda
    volumes:
      - model-weights:/weights
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s
    depends_on:
      init-weights:
        condition: service_completed_successfully
    expose: ["8000"]
    networks:
      default:
        aliases: [model-server]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]

  # ── laya CPU ────────────────────────────────────────────────────────────────
  laya:
    build:
      context: .
      dockerfile: Dockerfile.laya
    profiles: ["laya"]
    env_file: [compose/laya.env]
    volumes:
      - model-weights:/weights
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
    depends_on:
      init-weights:
        condition: service_completed_successfully
    expose: ["8000"]
    networks:
      default:
        aliases: [model-server]

  # ── laya GPU ────────────────────────────────────────────────────────────────
  laya-gpu:
    build:
      context: .
      dockerfile: Dockerfile.laya
      args:
        TORCH_INDEX: cu130
        TORCH_VERSION: "2.14.0"
    profiles: ["laya,gpu"]
    env_file: [compose/laya.env]
    environment:
      LAYA_DEVICE: cuda
    volumes:
      - model-weights:/weights
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
    depends_on:
      init-weights:
        condition: service_completed_successfully
    expose: ["8000"]
    networks:
      default:
        aliases: [model-server]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]

  # ── archivist ───────────────────────────────────────────────────────────────
  # Always connects to http://model-server:8000 — the active model service
  # registers that DNS alias on the internal network.
  # Set ARCHIVIST_MODEL=laya when using COMPOSE_PROFILES=laya[,gpu].
  archivist:
    build:
      context: .
    depends_on:
      von:
        condition: service_healthy
        required: false
      von-gpu:
        condition: service_healthy
        required: false
      laya:
        condition: service_healthy
        required: false
      laya-gpu:
        condition: service_healthy
        required: false
    environment:
      ARCHIVIST_MODEL: von
      ARCHIVIST_MODEL_URL: http://model-server:8000
      ARCHIVIST_NO_PREVIEW: "true"
    volumes:
      - ./in:/data/in
      - ./out:/data/out
      - ./examples:/data/examples:ro
      # Optional: mount your config and taxonomy/tags files.
      # - ./config.yaml:/data/config.yaml:ro
    command: ["run"]

volumes:
  model-weights: {}
