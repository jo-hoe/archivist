name: Dependabot auto-merge

# Enables auto-merge on Dependabot PRs for minor and patch updates. The PR still
# merges only after required status checks (CI) pass, because auto-merge waits
# for branch-protection checks.
#
# Requires, in the repository settings:
#   * "Allow auto-merge" enabled.
#   * A branch-protection rule on `main` requiring the CI checks to pass.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for minor/patch updates
        if: steps.meta.outputs.update-type == 'version-update:semver-minor' || steps.meta.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
